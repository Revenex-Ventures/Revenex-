kind = "web"
previewPath = "/"
title = "Revenex"
version = "1.0.0"
id = "artifacts/revenex"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20385

[services.development]
run = "pnpm --filter @workspace/revenex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revenex", "run", "build" ]
publicDir = "artifacts/revenex/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20385"
BASE_PATH = "/"
