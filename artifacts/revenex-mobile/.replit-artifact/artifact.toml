kind = "mobile"
previewPath = "/mobile/"
title = "Revenex Mobile"
version = "1.0.0"
id = "artifacts/revenex-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 25421

[services.development]
run = "pnpm --filter @workspace/revenex-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revenex-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/revenex-mobile", "run", "serve" ]

[services.env]
PORT = "25421"
BASE_PATH = "/mobile/"
